name: Build and deploy website via SFTP to webgo

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    name: Build Quasar and sync to webgo
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Quasar App
        run: npm run build

      - name: Sync files over SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: sftp
          port: 22                                # Wichtig für SFTP bei webgo
          local-dir: ./dist/spa/
          server-dir: /home/www/sixl.org/website-quasar-2026/
