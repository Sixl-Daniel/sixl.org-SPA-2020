name: Build and deploy website via SFTP to webgo

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Quasar and sync to webgo
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Quasar App
        run: npm run build

      - name: Create build information
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_BRANCH: ${{ github.ref_name }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_RUN_NUMBER: ${{ github.run_number }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const buildInfo = {
            builtAt: new Date().toISOString(),
            commit: process.env.BUILD_COMMIT,
            branch: process.env.BUILD_BRANCH,
            runNumber: process.env.BUILD_RUN_NUMBER,
            runAttempt: process.env.BUILD_RUN_ATTEMPT,
            runUrl: process.env.BUILD_RUN_URL
          };

          writeFileSync(
            'dist/spa/build-info.json',
            JSON.stringify(buildInfo, null, 2) + '\n'
          );
          NODE

      - name: Upload website files
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server: ${{ secrets.FTP_SERVER }}
          port: 22
          local_path: './dist/spa/*'
          remote_path: '/home/www/sixl.org/website-quasar-2026'

      - name: Upload Apache configuration
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server: ${{ secrets.FTP_SERVER }}
          port: 22
          local_path: './dist/spa/.htaccess'
          remote_path: '/home/www/sixl.org/website-quasar-2026'
