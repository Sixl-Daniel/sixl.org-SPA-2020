name: Build and deploy website via SFTP to webgo

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-webgo-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build website and deploy to webgo
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Verify build output
        run: |
          for file in dist/spa/index.html dist/spa/.htaccess; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty file: $file"
              exit 1
            fi
          done

      - name: Upload website files
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server: ${{ secrets.FTP_SERVER }}
          port: 22
          local_path: './dist/spa/*'
          remote_path: '/home/www/sixl.org/website-quasar-2026'

      - name: Upload Apache configuration
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server: ${{ secrets.FTP_SERVER }}
          port: 22
          local_path: './dist/spa/.htaccess'
          remote_path: '/home/www/sixl.org/website-quasar-2026'
